name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .

  test:
    name: Test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # torch and torchvision must come from the same index, or the resulting
      # mixed CPU/CUDA pair fails to register shared ops (torchvision::nms).
      - name: Install CPU PyTorch
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install package with test extras
        run: pip install -e ".[test]"
      # GPU-marked tests auto-skip on these CPU-only runners.
      # MEDTOK_RUN_NETWORK_TESTS is left unset so network tests are skipped.
      - name: Run tests
        run: pytest -m "not network" -q --cov=medtokenizers --cov-report=term-missing
